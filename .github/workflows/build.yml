name: Build bin/spruchband

# bin/spruchband is never built on a developer machine. This workflow builds
# it from src/ in this repository, runs the tests, records a signed build
# provenance attestation for it and commits it in a commit of its own,
# "Build bin/spruchband from <source commit>". Check a copy with
#
#   gh attestation verify bin/spruchband --repo tomkenner/omarchy-spruchband
#
# Pushes to other branches only build and test; nothing is committed.

on:
  push:
    paths:
      - src/**
      - tests/**
      - spruchband.pro
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Qt from Omarchy's package mirror
        run: |
          # Omarchy installs Arch packages from its own stable mirror, which
          # trails Arch. Building against the Qt that Omarchy users have keeps
          # the program from needing symbols their Qt does not have yet; -uu
          # also moves the container's packages back to that mirror's state.
          echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman-key --init
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Suu --noconfirm --needed git qt6-base qt6-declarative layer-shell-qt
          pacman -Q qt6-base qt6-declarative layer-shell-qt gcc glibc

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: |
          mkdir -p build/tests
          cd build/tests
          qmake6 ../../tests/spruchband_tests.pro
          make -j"$(nproc)"
          QT_QPA_PLATFORM=offscreen ./spruchband_tests

      - name: Build
        run: |
          mkdir -p build/app
          cd build/app
          qmake6 ../../spruchband.pro
          make -j"$(nproc)"
          install -D -m 755 -s spruchband ../out/spruchband
          ../out/spruchband --version
          sha256sum ../out/spruchband

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spruchband
          path: build/out/spruchband
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spruchband
          path: ${{ runner.temp }}/artifact

      - name: Put the program into bin/
        run: install -m 755 "$RUNNER_TEMP/artifact/spruchband" bin/spruchband

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bin/spruchband

      - name: Commit bin/spruchband
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/spruchband
          if git diff --cached --quiet; then
            echo "bin/spruchband is unchanged"
            exit 0
          fi
          sum=$(sha256sum bin/spruchband | cut -d' ' -f1)
          git commit -F - <<EOF
          Build bin/spruchband from $GITHUB_SHA

          sha256 $sum
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Check: gh attestation verify bin/spruchband --repo $GITHUB_REPOSITORY
          EOF
          git push origin HEAD:main
